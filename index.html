<!DOCTYPE html>
<html lang="ar" dir="ltr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>أين الصورة؟ Where is it?</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Baloo+2:wght@700;800&display=swap">
<style>
:root{
  color-scheme:light;
  --bg:#e6f4ff; --ink:#14284b; --card:#ffffff; --line:#9db7d5; --slot:#cfe3f7; --muted:#4a6285;
  --in:#2f6bff; --on:#16a06a; --un:#f5821f; --ok:#16a06a; --pic-bd:#37474f;
}
@media (prefers-color-scheme:dark){
  :root:not([data-theme="light"]){
    color-scheme:dark;
    --bg:#101c33; --ink:#eaf2ff; --card:#1b2c4d; --line:#4a6a99; --slot:#223a63; --muted:#a9bddb; --pic-bd:#0b1426;
  }
}
:root[data-theme="dark"]{
  color-scheme:dark;
  --bg:#101c33; --ink:#eaf2ff; --card:#1b2c4d; --line:#4a6a99; --slot:#223a63; --muted:#a9bddb; --pic-bd:#0b1426;
}
:root{box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
html{scroll-padding-top:env(safe-area-inset-top,0px)}
*,*::before,*::after{box-sizing:inherit}
body{margin:0;background:var(--bg);color:var(--ink);font-family:"Baloo 2","Trebuchet MS","Segoe UI",system-ui,sans-serif;
  min-height:100vh;-webkit-user-select:none;user-select:none}
main{max-width:760px;margin:0 auto;padding:14px 14px 28px}
header{text-align:center;margin-bottom:6px}
h1{margin:0;font-size:clamp(24px,6vw,36px);font-weight:800;line-height:1.2}
.sub{margin:2px 0 0;color:var(--muted);font-size:clamp(15px,4vw,19px);direction:ltr}
.stars{display:flex;justify-content:center;gap:6px;margin:8px 0 10px;font-size:30px;line-height:1;direction:ltr}
.stars span{color:var(--line);transition:transform .25s,color .25s}
.stars span.on{color:#ffb400;transform:scale(1.2)}
.rows{display:grid;gap:12px}
.row{--pw:clamp(84px,22vw,120px);display:flex;align-items:center;justify-content:center;gap:clamp(8px,2.5vw,16px);
  padding:10px;border-radius:22px;border:3px dashed transparent;transition:background .15s,border-color .15s}
.row.hot{background:color-mix(in srgb,var(--c) 18%,transparent);border-color:var(--c)}
.word{flex:0 0 auto;width:clamp(120px,32vw,200px);height:clamp(84px,22vw,120px);border-radius:20px;background:var(--c);color:#fff;
  border:4px solid var(--ink);font-size:clamp(40px,11vw,64px);font-weight:800;display:flex;flex-direction:column;align-items:center;
  justify-content:center;line-height:1;cursor:pointer;direction:ltr;touch-action:manipulation}
.word small{font-size:clamp(13px,3.4vw,18px);font-weight:700;margin-top:4px;direction:rtl;opacity:.95}
.word:focus-visible,button:focus-visible{outline:4px solid #ffb400;outline-offset:3px}
.slot{width:var(--pw);aspect-ratio:4/3;border-radius:14px;background:var(--slot);border:3px dashed var(--line);flex:0 0 auto;display:flex}
.slot.filled{border:3px solid var(--ok);background:transparent}
.tray{margin-top:16px;padding:14px 10px;border-radius:24px;background:var(--card);border:3px solid var(--line);
  display:flex;flex-wrap:wrap;justify-content:center;gap:clamp(8px,2.5vw,14px);min-height:calc(2 * clamp(84px,22vw,120px) * .75 + 40px)}
.pic,.ph{width:clamp(84px,22vw,120px);aspect-ratio:4/3;flex:0 0 auto}
.ph{visibility:hidden}
.pic{border-radius:14px;overflow:hidden;border:3px solid var(--pic-bd);cursor:grab;touch-action:none;background:#e3f4ff;display:block}
.pic svg{width:100%;height:100%;display:block;pointer-events:none}
.pic.drag{position:fixed;z-index:50;cursor:grabbing;transform:scale(1.12) rotate(-3deg);box-shadow:0 10px 22px rgba(0,0,0,.35)}
.pic.placed{cursor:default;width:100%;height:100%;aspect-ratio:auto;border-color:var(--ok)}
.pic.shake{animation:shake .4s}
@keyframes shake{20%{transform:translateX(-8px)}40%{transform:translateX(8px)}60%{transform:translateX(-6px)}80%{transform:translateX(6px)}}
.pic.pop{animation:pop .45s}
@keyframes pop{50%{transform:scale(1.15)}}
.hint{text-align:center;color:var(--muted);margin:10px 0 0;font-size:clamp(15px,4vw,18px)}
#win{position:fixed;inset:0;display:none;align-items:center;justify-content:center;background:rgba(10,20,45,.6);z-index:100;padding:20px}
#win.show{display:flex}
#win .box{background:var(--card);border:5px solid #ffb400;border-radius:28px;padding:26px 22px;text-align:center;max-width:420px}
#win h2{margin:0;font-size:clamp(34px,9vw,50px)}
#win p{margin:6px 0 14px;font-size:24px;direction:ltr;color:var(--muted)}
button.again{font:inherit;font-weight:800;font-size:24px;background:var(--on);color:#fff;border:4px solid var(--ink);border-radius:18px;padding:8px 26px;cursor:pointer}
.conf{position:fixed;top:-40px;font-size:30px;z-index:101;pointer-events:none;animation:fall linear forwards}
@keyframes fall{to{transform:translateY(110vh) rotate(360deg)}}
@media (prefers-reduced-motion:reduce){.pic.shake,.pic.pop,.conf{animation:none}}
</style>
</head>
<body>
<main>
  <header>
    <h1>ضع كل صورة في مكانها</h1>
    <p class="sub">Drag each picture to its word</p>
  </header>
  <div class="stars" id="stars" aria-label="progress"></div>
  <section class="rows" id="rows"></section>
  <section class="tray" id="tray" aria-label="الصور"></section>
  <p class="hint">اضغط على الكلمة لتسمعها</p>
</main>
<div id="win" role="dialog" aria-live="polite"><div class="box"><h2>أحسنت! ⭐</h2><p>Great job!</p><button class="again" id="again">من جديد</button></div></div>

<script>
const ST='stroke="#37474f" stroke-width="3" stroke-linejoin="round" stroke-linecap="round"';
const ball=(x,y)=>`<circle cx="${x}" cy="${y}" r="13" fill="#ef5350" ${ST}/><path d="M${x-13} ${y}Q${x} ${y-10} ${x+13} ${y}" fill="none" ${ST}/>`;
const chair=(x,y)=>`<g fill="#8d6e63" ${ST}><rect x="${x-27}" y="${y-34}" width="6" height="34"/><rect x="${x+21}" y="${y-34}" width="6" height="34"/><rect x="${x-27}" y="${y-82}" width="6" height="40"/><rect x="${x+21}" y="${y-82}" width="6" height="40"/><rect x="${x-27}" y="${y-82}" width="54" height="8"/><rect x="${x-31}" y="${y-42}" width="62" height="9" fill="#a1887f"/></g>`;
const boxF=(x,y)=>`<rect x="${x-40}" y="${y-42}" width="80" height="42" fill="#d7a86e" ${ST}/><rect x="${x-44}" y="${y-48}" width="88" height="9" fill="#b98a52" ${ST}/>`;
const table=(x,y)=>`<g fill="#8d6e63" ${ST}><rect x="${x-42}" y="${y-44}" width="7" height="44"/><rect x="${x+35}" y="${y-44}" width="7" height="44"/><rect x="${x-50}" y="${y-52}" width="100" height="9" fill="#a1887f"/></g>`;
const cat=(x,y,s=1)=>`<g transform="translate(${x} ${y}) scale(${s})"><path d="M18 -8Q40 -12 32 -34" fill="none" stroke="#37474f" stroke-width="5" stroke-linecap="round"/><ellipse cy="-14" rx="21" ry="14" fill="#f9a03f" ${ST}/><path d="M-14 -44L-10 -60L-1 -48ZM14 -44L10 -60L1 -48Z" fill="#f9a03f" ${ST}/><circle cy="-38" r="14" fill="#f9a03f" ${ST}/><circle cx="-5" cy="-40" r="2" fill="#37474f"/><circle cx="5" cy="-40" r="2" fill="#37474f"/><path d="M-3 -33Q0 -30 3 -33" fill="none" stroke="#37474f" stroke-width="1.8"/></g>`;
const scene=i=>`<svg viewBox="0 0 200 150" xmlns="http://www.w3.org/2000/svg"><rect width="200" height="150" fill="#e3f4ff"/><rect y="102" width="200" height="48" fill="#c5e8a8"/><line x1="0" y1="102" x2="200" y2="102" stroke="#37474f" stroke-width="1.5"/>${i}</svg>`;

const ITEMS=[
 {w:'in',  say:'The ball is in the box.',  svg:scene(ball(100,76)+boxF(100,128))},
 {w:'in',  say:'The cat is in the box.',   svg:scene(cat(100,106,.95)+boxF(100,128))},
 {w:'on',  say:'The ball is on the chair.',svg:scene(chair(100,128)+ball(100,73))},
 {w:'on',  say:'The cat is on the table.', svg:scene(table(100,128)+cat(100,76,.9))},
 {w:'under',say:'The ball is under the chair.',svg:scene(chair(100,128)+ball(100,115))},
 {w:'under',say:'The cat is under the table.', svg:scene(table(100,128)+cat(100,128,.72))}
];
const WORDS=[{w:'in',ar:'داخل',c:'var(--in)'},{w:'on',ar:'فوق',c:'var(--on)'},{w:'under',ar:'تحت',c:'var(--un)'}];

let ac;
const beep=(f,d=.15,t=0)=>{try{ac=ac||new(window.AudioContext||window.webkitAudioContext)();const o=ac.createOscillator(),g=ac.createGain();o.frequency.value=f;g.gain.value=.14;o.connect(g);g.connect(ac.destination);o.start(ac.currentTime+t);o.stop(ac.currentTime+t+d)}catch(e){}};
const say=s=>{try{speechSynthesis.cancel();const u=new SpeechSynthesisUtterance(s);u.lang='en-US';u.rate=.8;speechSynthesis.speak(u)}catch(e){}};

const rowsEl=document.getElementById('rows'),tray=document.getElementById('tray'),starsEl=document.getElementById('stars');
WORDS.forEach(o=>{
  const r=document.createElement('div');r.className='row';r.dataset.word=o.w;r.style.setProperty('--c',o.c);
  r.innerHTML=`<div class="word" role="button" tabindex="0" aria-label="${o.w}">${o.w}<small>${o.ar}</small></div><div class="slot"></div><div class="slot"></div>`;
  const wd=r.querySelector('.word');
  const speak=()=>{beep(520,.08);say(o.w)};
  wd.addEventListener('click',speak);
  wd.addEventListener('keydown',e=>{if(e.key==='Enter'||e.key===' '){e.preventDefault();speak()}});
  rowsEl.appendChild(r);
});
starsEl.innerHTML=ITEMS.map(()=>'<span>★</span>').join('');

const pics=ITEMS.map(it=>{
  const p=document.createElement('div');p.className='pic';p.innerHTML=it.svg;p.dataset.word=it.w;p.dataset.say=it.say;
  p.setAttribute('aria-label',it.say);p.addEventListener('pointerdown',down);return p;
});
let placed=0;
const shuffle=a=>{for(let i=a.length-1;i>0;i--){const j=Math.floor(Math.random()*(i+1));[a[i],a[j]]=[a[j],a[i]]}return a};
function fillTray(){shuffle(pics.slice()).forEach(p=>tray.appendChild(p))}
fillTray();

const rowAt=(x,y)=>document.elementsFromPoint(x,y).map(e=>e.closest&&e.closest('.row')).find(Boolean);
let drag=null;
function down(e){
  const p=e.currentTarget;if(p.classList.contains('placed'))return;
  e.preventDefault();beep(440,.05);
  const b=p.getBoundingClientRect();
  const ph=document.createElement('div');ph.className='ph';p.before(ph);
  drag={p,ph,dx:e.clientX-b.left,dy:e.clientY-b.top,hot:null};
  p.style.width=b.width+'px';p.style.height=b.height+'px';
  p.classList.add('drag');place(e);
  p.setPointerCapture(e.pointerId);
  p.addEventListener('pointermove',move);p.addEventListener('pointerup',up);p.addEventListener('pointercancel',up);
}
function place(e){drag.p.style.left=(e.clientX-drag.dx)+'px';drag.p.style.top=(e.clientY-drag.dy)+'px'}
function move(e){
  place(e);const r=rowAt(e.clientX,e.clientY);
  if(r!==drag.hot){drag.hot&&drag.hot.classList.remove('hot');r&&r.classList.add('hot');drag.hot=r||null}
}
function up(e){
  const {p,ph}=drag;
  p.removeEventListener('pointermove',move);p.removeEventListener('pointerup',up);p.removeEventListener('pointercancel',up);
  drag.hot&&drag.hot.classList.remove('hot');
  const r=e.type==='pointerup'?rowAt(e.clientX,e.clientY):null;
  p.classList.remove('drag');p.style.cssText='';
  const slot=r&&r.dataset.word===p.dataset.word&&r.querySelector('.slot:not(.filled)');
  if(slot){
    slot.appendChild(p);slot.classList.add('filled');p.classList.add('placed','pop');ph.remove();
    beep(660,.12);beep(880,.2,.12);say(p.dataset.say);
    const n=++placed;[...starsEl.children].forEach((s,i)=>s.classList.toggle('on',i<n));
    if(n===ITEMS.length)setTimeout(win,1400);
  }else{
    ph.replaceWith(p);p.classList.add('shake');beep(200,.25);
    setTimeout(()=>p.classList.remove('shake'),450);
  }
  drag=null;
}
function win(){
  document.getElementById('win').classList.add('show');
  if(matchMedia('(prefers-reduced-motion:reduce)').matches)return;
  for(let i=0;i<28;i++){const s=document.createElement('span');s.className='conf';s.textContent=['⭐','🎈','✨'][i%3];
    s.style.left=Math.random()*100+'vw';s.style.animationDuration=(2+Math.random()*2)+'s';s.style.animationDelay=Math.random()*.8+'s';
    document.body.appendChild(s);setTimeout(()=>s.remove(),5000)}
}
document.getElementById('again').addEventListener('click',()=>{
  document.getElementById('win').classList.remove('show');
  document.querySelectorAll('.slot').forEach(s=>{s.classList.remove('filled');s.innerHTML=''});
  pics.forEach(p=>p.classList.remove('placed','pop'));
  placed=0;[...starsEl.children].forEach(s=>s.classList.remove('on'));fillTray();
});
</script>
</body>
</html>
